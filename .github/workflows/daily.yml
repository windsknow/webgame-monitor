name: 每日采集与发布

on:
  schedule:
    # 每天北京时间 10:30（UTC 02:30）。X 数据约 09:30 生成，留一小时余量。
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '指定日期 YYYY-MM-DD（留空为今天）'
        required: false
  push:
    branches: [main]
    paths: ['data/games.json', 'data/candidates.json', 'data/x_judgments.json', 'config.json', 'templates/**', 'monitor/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 跑管线
        env:
          TZ: Asia/Shanghai
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          X_PULL_URL: ${{ secrets.X_PULL_URL }}
          X_PULL_TOKEN: ${{ secrets.X_PULL_TOKEN }}
          MONITOR_DATE: ${{ github.event.inputs.date }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # 人工改了数据或配置：不重新采集，只重新合并和生成页面
            python3 run.py merge && python3 run.py site
          else
            python3 run.py daily
          fi
      - name: 提交数据
        run: |
          git config user.name "webgame-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add raw data assets digest
          git diff --cached --quiet || git commit -m "数据更新 $(TZ=Asia/Shanghai date +%F)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
